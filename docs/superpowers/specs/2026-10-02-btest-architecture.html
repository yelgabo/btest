<main>
<h1>btest architecture</h1>
<p class="lede">What talks to what, and where strategy code runs. October 2, 2026.</p>
<figure id="bt-figure">
  <style>
    #bt-figure { margin: 24px 0; min-width: 0; }

    #bt-figure svg { display: block; width: 100%; min-width: 1200px; height: auto; }
    #bt-figure text { font-family: "Avenir Next", Avenir, system-ui, sans-serif; fill: #f0ece3; }
    #bt-figure .title { font-size: 21px; }
    #bt-figure .detail { fill: #c0bcb6; font-size: 17px; }
    #bt-figure .edge-label { fill: #c0bcb6; font-size: 16px; }
    #bt-figure .note { fill: #c0bcb6; font-size: 15px; }

    #bt-figure .edge { fill: none; stroke: #dec18a; stroke-width: 1.8; marker-end: url(#bt-arrow); }
    #bt-figure figcaption { margin-top: 10px; font: 14px/1.6 system-ui, sans-serif; color: #c0bcb6; }
  </style>
  <div class="diagram-scroll" tabindex="0" role="region"
       aria-label="btest architecture, scroll horizontally on small screens">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1130" role="img"
         aria-labelledby="bt-title bt-desc">
      <title id="bt-title">btest architecture, October 2026</title>
      <desc id="bt-desc">
        The browser talks to the web service, which saves strategy versions and run results in
        Postgres and enqueues jobs as lab.job rows. The worker claims jobs and spawns a limited
        child process per job or indicator; children read Parquet bars from the worker's volume
        and insert results as the restricted btest_runner role. The worker also ingests market
        data each weekday and serves candles to the web service over the private network. The
        laptop CLI writes runs through Postgres's public proxy and keeps its own bar copy.
      </desc>
      <defs>
        <marker id="bt-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7"
                markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0L10 5L0 10Z" fill="#dec18a"/>
        </marker>
      </defs>
      <rect width="1800" height="1130" fill="#101013"/>

      <text class="title" x="170.0" y="202.0" text-anchor="middle" font-weight="600">Your browser</text>

      <text class="detail" x="615.0" y="225.0" text-anchor="middle">UI, JSON API, login</text>
      <text class="detail" x="615.0" y="249.0" text-anchor="middle">Never runs strategy code</text>
      <path d="M470 400H706A18 66.0 0 0 1 706 532H470A18 66.0 0 0 1 470 400Z" fill="#1b1b20" stroke="#a38e68" stroke-width="1.5"/>
      <ellipse cx="706" cy="466.0" rx="18" ry="66.0" fill="#25252a" stroke="#a38e68" stroke-width="1.5"/>
      <text class="title" x="585.0" y="436" text-anchor="middle" font-weight="600">Job queue</text>
      <rect x="488.0" y="454" width="58" height="32" rx="5" fill="#2c2821" stroke="#dec18a" stroke-width="1.2"/>
      <text class="item" x="517.0" y="475" text-anchor="middle">jobId</text>
      <rect x="556.0" y="454" width="58" height="32" rx="5" fill="#2c2821" stroke="#dec18a" stroke-width="1.2"/>

      <rect x="624.0" y="454" width="58" height="32" rx="5" fill="#2c2821" stroke="#dec18a" stroke-width="1.2"/>
      <text class="item" x="653.0" y="475" text-anchor="middle">jobId</text>
      <text class="note" x="585.0" y="514" text-anchor="middle">rows in lab.job (Postgres)</text>
      <rect x="470" y="660" width="290" height="130" rx="10" fill="#1b1b20" stroke="#686158" stroke-width="1.5"/>
      <text class="title" x="615.0" y="705.0" text-anchor="middle" font-weight="600">Worker service</text>
      <text class="detail" x="615.0" y="735.0" text-anchor="middle">Claims jobs, nightly ingest</text>
      <text class="detail" x="615.0" y="759.0" text-anchor="middle">Serves candles, indicators</text>
      <path d="M920 300A150.0 20 0 0 1 1220 300V490A150.0 20 0 0 1 920 490Z" fill="#1b1b20" stroke="#a38e68" stroke-width="1.5"/>
      <ellipse cx="1070.0" cy="300" rx="150.0" ry="20" fill="#25252a" stroke="#a38e68" stroke-width="1.5"/>
      <text class="title" x="1070.0" y="360" text-anchor="middle" font-weight="600">Postgres</text>
      <text class="detail" x="1070.0" y="392" text-anchor="middle">Market data, splits, rates</text>
      <text class="detail" x="1070.0" y="416" text-anchor="middle">Runs, fills, sweeps</text>
      <text class="detail" x="1070.0" y="440" text-anchor="middle">Strategy versions, jobs</text>
      <rect x="948" y="632" width="290" height="130" rx="10" fill="#25252a" stroke="#b4a077" stroke-width="1.5"/>
      <rect x="934" y="646" width="290" height="130" rx="10" fill="#25252a" stroke="#b4a077" stroke-width="1.5"/>
      <rect x="920" y="660" width="290" height="130" rx="10" fill="#1b1b20" stroke="#686158" stroke-width="1.5"/>

      <text class="title" x="1070.0" y="922" text-anchor="middle" font-weight="600">Volume /data</text>
      <text class="detail" x="1070.0" y="954" text-anchor="middle">Parquet minute bars</text>
      <rect x="1500" y="370" width="260" height="130" rx="10" fill="#1b1b20" stroke="#686158" stroke-width="1.5"/>

      <text class="detail" x="1630.0" y="469.0" text-anchor="middle">Own Parquet copy</text>
      <rect x="1480" y="830" width="300" height="130" rx="10" fill="#1b1b20" stroke="#686158" stroke-width="1.5"/>
      <text class="title" x="1630.0" y="875.0" text-anchor="middle" font-weight="600">Market data APIs</text>
      <text class="detail" x="1630.0" y="905.0" text-anchor="middle">Alpaca: bars, splits, dividends</text>
      <text class="detail" x="1630.0" y="929.0" text-anchor="middle">FRED: T-bill rates</text>
      <path class="edge" d="M300 210H470"/>
      <text class="edge-label" x="405" y="178" text-anchor="middle">HTTPS +</text>
      <text class="edge-label" x="405" y="200" text-anchor="middle">login cookie</text>

      <text class="edge-label" x="752" y="442" text-anchor="start">indicator lines</text>
      <text class="edge-label" x="752" y="464" text-anchor="start">(private, token)</text>
      <path class="edge" d="M760 725H920"/>
      <text class="edge-label" x="840" y="686" text-anchor="middle">Spawn per job</text>
      <text class="edge-label" x="840" y="708" text-anchor="middle">code on stdin</text>
      <path class="edge" d="M1080 632V510"/>
      <text class="edge-label" x="1092" y="556" text-anchor="start">Read splits + rates,</text>
      <text class="edge-label" x="1092" y="578" text-anchor="start">insert results</text>
      <text class="edge-label" x="1092" y="600" text-anchor="start">(btest_runner role)</text>
      <path class="edge" d="M1065 790V850"/>

      <path class="edge" d="M560 790V920H920"/>
      <text class="edge-label" x="740" y="902" text-anchor="middle">Append bars (ingest)</text>
      <path class="edge" d="M505 790V1062H1630V960"/>
      <text class="edge-label" x="1066" y="1050" text-anchor="middle">Fetch bars, splits, dividends, rates (weekdays 22:00 UTC)</text>
      <path class="edge" d="M1500 435H1220"/>
      <text class="edge-label" x="1320" y="404" text-anchor="middle">Results + imports</text>

      <path class="edge" d="M1630 500V830"/>

      <text class="edge-label" x="1642" y="678" text-anchor="start">(own copy)</text>
      <text class="note" x="40" y="1104">Stacks = several processes at once. Cylinders = stored data. Queue items = job IDs. Dashed outline = the Railway project.</text>
    </svg>
  </div>
  <figcaption>
    Strategy code only runs in the child processes, never in the web service. The job queue is a
    table inside Postgres, drawn apart to show the hand-off. Not drawn: the worker's ingest also
    writes splits, dividends and coverage to Postgres; paper trading (planned); the CDN scripts
    the browser loads.
  </figcaption>
</figure>
