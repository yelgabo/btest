<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>btest live day</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0b0b0d; color: #f0ece3;
         font: 15px/1.6 "Avenir Next", Avenir, system-ui, sans-serif; }
  main { max-width: 1240px; margin: 0 auto; padding: 32px 20px 64px; min-width: 0; }
  h1 { font-size: 28px; font-weight: 600; margin: 0 0 6px; }
  .lede { color: #c0bcb6; max-width: 72ch; margin: 0; }
</style>
</head>
<body>
<main>
<h1>btest: a live trading day</h1>
<p class="lede">How new data reaches the strategies and how decisions become orders. Times are
New York time on a full trading day. October 4, 2026; nothing here is built yet.</p>
<figure id="ld-figure">
  <style>
    #ld-figure { margin: 24px 0; min-width: 0; }
    #ld-figure .diagram-scroll { overflow-x: auto; background: #101013; border-radius: 10px; }
    #ld-figure svg { display: block; width: 100%; min-width: 1200px; height: auto; }
    #ld-figure text { font-family: "Avenir Next", Avenir, system-ui, sans-serif; fill: #f0ece3; }
    #ld-figure .title { font-size: 21px; font-weight: 600; }
    #ld-figure .detail { fill: #c0bcb6; font-size: 17px; }
    #ld-figure .time { fill: #dec18a; font-size: 17px; font-weight: 600; }
    #ld-figure .edge-label { fill: #c0bcb6; font-size: 16px; }
    #ld-figure .lane { fill: #8a857d; font-size: 15px; letter-spacing: 0.08em; }
    #ld-figure .edge { fill: none; stroke: #dec18a; stroke-width: 1.8; marker-end: url(#ld-arrow); }
    #ld-figure .svc { fill: #1b1b20; stroke: #686158; stroke-width: 1.4; }
    #ld-figure .back { fill: #25252a; stroke: #b4a077; stroke-width: 1.5; }
    #ld-figure .store { fill: #1b1b20; stroke: #a38e68; stroke-width: 1.5; }
    #ld-figure .cap { fill: #25252a; stroke: #a38e68; stroke-width: 1.5; }
    #ld-figure figcaption { margin-top: 10px; font: 14px/1.6 system-ui, sans-serif; color: #c0bcb6; }
  </style>
  <div class="diagram-scroll" tabindex="0" role="region"
       aria-label="Live trading day diagram, scroll horizontally on small screens">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 960" role="img"
         aria-labelledby="ld-title ld-desc">
      <title id="ld-title">btest live trading day</title>
      <desc id="ld-desc">
        Top row, external sources: the EDGAR latest-filings feed, the EDGAR nightly daily index,
        the SEC companyfacts API and Alpaca market data. Middle row, worker jobs: the filing
        watcher polls the feed every ten minutes and fetches companyfacts or Form 4 XML for
        universe companies; the nightly filing reconcile reads the daily index for misses; the
        15:30 price snapshot pulls Alpaca bars. All three append to the point-in-time store in
        Postgres. Bottom row: the 15:30 decision run reads the store as of now and writes target
        weights; the 15:45 order run diffs targets against Alpaca positions and sends sells then
        buys to the Alpaca trading API; the 16:15 reconcile reads fills back and compares them
        with the backtest fill model.
      </desc>
      <defs>
        <marker id="ld-arrow" viewBox="0 0 10 10" refX="9" refY="5"
                markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0L10 5L0 10Z" fill="#dec18a"/>
        </marker>
      </defs>
      <rect width="1800" height="960" fill="#101013"/>

      <text class="lane" x="40" y="44">SOURCES</text>
      <text class="lane" x="40" y="314">DATA JOBS (WORKER)</text>
      <text class="lane" x="40" y="664">TRADING JOBS (WORKER)</text>

      <rect class="svc" x="40" y="64" width="330" height="110" rx="10"/>
      <text class="title" x="205" y="104" text-anchor="middle">EDGAR latest filings</text>
      <text class="detail" x="205" y="132" text-anchor="middle">Atom feed: 10-Q, 10-K, 8-K, 4</text>
      <text class="detail" x="205" y="156" text-anchor="middle">CIK + accession + time</text>

      <rect class="svc" x="430" y="64" width="300" height="110" rx="10"/>
      <text class="title" x="580" y="104" text-anchor="middle">EDGAR daily index</text>
      <text class="detail" x="580" y="132" text-anchor="middle">form.YYYYMMDD.idx</text>
      <text class="detail" x="580" y="156" text-anchor="middle">built from ~22:00</text>

      <rect class="svc" x="790" y="64" width="320" height="110" rx="10"/>
      <text class="title" x="950" y="104" text-anchor="middle">SEC data APIs</text>
      <text class="detail" x="950" y="132" text-anchor="middle">companyfacts, Form 4 XML</text>
      <text class="detail" x="950" y="156" text-anchor="middle">updated within a minute</text>

      <rect class="svc" x="1360" y="64" width="340" height="110" rx="10"/>
      <text class="title" x="1530" y="104" text-anchor="middle">Alpaca</text>
      <text class="detail" x="1530" y="132" text-anchor="middle">market data (SIP, 15 min delay)</text>
      <text class="detail" x="1530" y="156" text-anchor="middle">trading API (paper, then live)</text>

      <rect class="svc" x="40" y="340" width="330" height="130" rx="10"/>
      <text class="time" x="205" y="374" text-anchor="middle">every 10 min, 06:00-20:00</text>
      <text class="title" x="205" y="404" text-anchor="middle">Filing watcher</text>
      <text class="detail" x="205" y="432" text-anchor="middle">keep universe CIKs,</text>
      <text class="detail" x="205" y="456" text-anchor="middle">new accession numbers</text>

      <rect class="svc" x="430" y="340" width="300" height="130" rx="10"/>
      <text class="time" x="580" y="374" text-anchor="middle">~01:00</text>
      <text class="title" x="580" y="404" text-anchor="middle">Filing reconcile</text>
      <text class="detail" x="580" y="432" text-anchor="middle">fetch filings the</text>
      <text class="detail" x="580" y="456" text-anchor="middle">watcher missed, log them</text>

      <rect class="svc" x="1360" y="340" width="340" height="130" rx="10"/>
      <text class="time" x="1530" y="374" text-anchor="middle">15:30</text>
      <text class="title" x="1530" y="404" text-anchor="middle">Price snapshot</text>
      <text class="detail" x="1530" y="432" text-anchor="middle">bars through ~15:14</text>
      <text class="detail" x="1530" y="456" text-anchor="middle">plus option quotes (#5)</text>

      <path class="store" d="M820 356A150 16 0 0 1 1120 356V500A150 16 0 0 1 820 500Z"/>
      <ellipse class="cap" cx="970" cy="356" rx="150" ry="16"/>
      <text class="title" x="970" y="402" text-anchor="middle">Point-in-time store</text>
      <text class="detail" x="970" y="430" text-anchor="middle">Postgres, append-only</text>
      <text class="detail" x="970" y="456" text-anchor="middle">rows carry accepted_at</text>
      <text class="detail" x="970" y="482" text-anchor="middle">queries take as_of</text>

      <path class="edge" d="M205 174V340"/>
      <text class="edge-label" x="217" y="262">poll</text>
      <path class="edge" d="M580 174V340"/>
      <text class="edge-label" x="592" y="262">read nightly</text>
      <path class="edge" d="M370 420H400V230H950V174"/>
      <path class="edge" d="M730 440H760V250H970V174"/>
      <text class="edge-label" x="660" y="222" text-anchor="middle">fetch facts or Form 4 for the filing</text>
      <path class="edge" d="M1530 174V340"/>
      <text class="edge-label" x="1542" y="262">fetch bars</text>
      <path class="edge" d="M205 470V550H900V502"/>
      <text class="edge-label" x="560" y="540" text-anchor="middle">append</text>
      <path class="edge" d="M730 400H820"/>
      <text class="edge-label" x="775" y="390" text-anchor="middle">append</text>
      <path class="edge" d="M1360 420H1120"/>
      <text class="edge-label" x="1240" y="406" text-anchor="middle">append</text>

      <rect class="svc" x="40" y="690" width="420" height="140" rx="10"/>
      <text class="time" x="250" y="724" text-anchor="middle">15:30</text>
      <text class="title" x="250" y="754" text-anchor="middle">Decision run</text>
      <text class="detail" x="250" y="782" text-anchor="middle">decide(now, data) per strategy</text>
      <text class="detail" x="250" y="806" text-anchor="middle">same function as the backtest</text>

      <rect class="svc" x="620" y="690" width="420" height="140" rx="10"/>
      <text class="time" x="830" y="724" text-anchor="middle">15:45</text>
      <text class="title" x="830" y="754" text-anchor="middle">Order run</text>
      <text class="detail" x="830" y="782" text-anchor="middle">diff targets vs positions</text>
      <text class="detail" x="830" y="806" text-anchor="middle">fractional day orders, sells first</text>

      <rect class="svc" x="1200" y="690" width="500" height="140" rx="10"/>
      <text class="time" x="1450" y="724" text-anchor="middle">16:15</text>
      <text class="title" x="1450" y="754" text-anchor="middle">Reconcile</text>
      <text class="detail" x="1450" y="782" text-anchor="middle">store fills; compare with backtest fills;</text>
      <text class="detail" x="1450" y="806" text-anchor="middle">kill switch on loss or order size</text>

      <path class="edge" d="M1000 502V600H250V690"/>
      <text class="edge-label" x="560" y="590" text-anchor="middle">read as of 15:30</text>
      <path class="edge" d="M460 760H620"/>
      <text class="edge-label" x="540" y="746" text-anchor="middle">target weights</text>
      <path class="edge" d="M960 690V620H1620V174"/>
      <text class="edge-label" x="1290" y="610" text-anchor="middle">send orders, read positions</text>
      <path class="edge" d="M1680 174V690"/>
      <text class="edge-label" x="1692" y="560">fills</text>
      <path class="edge" d="M1200 790H1070V502"/>
      <text class="edge-label" x="1135" y="780" text-anchor="middle">store fills</text>
    </svg>
  </div>
  <figcaption>
    Data jobs append, never overwrite, so a backtest at an earlier as_of sees exactly what the
    live run saw then. The 18:00 price ingest and the weekly universe refresh are omitted.
  </figcaption>
</figure>
</main>
</body>
</html>
