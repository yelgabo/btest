# Claim ledger for cwmr-etf.tex. Every unit of the paper (sentence, caption, table row,
# heading) belongs to one claim or to no_claim; every claim lists the evidence it rests on.
# check_claims.py enforces this; see its docstring for the workflow.

replication_commit = "3551cf2"

no_claim = [
  "HEADING: Introduction",
  "Online portfolio selection treats investing as a repeated game.",
  "Each period an algorithm holds a portfolio, observes the period's price changes and updates its weights by a fixed rule.",
  "A later family of algorithms bets on reversal instead.",
  "The question here is whether any version of their CWMR survives trading costs and timing on instruments a retail investor can buy today.",
  "HEADING: Related work.",
  "Section~\\ref{sec:data} describes the data and methods.",
  "Section~\\ref{sec:repro} reproduces the original paper.",
  "Section~\\ref{sec:results} tests CWMR on the ETFs over 1999--2024, Section~\\ref{sec:costs} asks what costs it can bear, Section~\\ref{sec:weekly} examines the weekly variant and Section~\\ref{sec:holdout} reports the holdout test.",
  "Section~\\ref{sec:deviations} reports the pre-registered tests and where we departed from their plans.",
  "Section~\\ref{sec:discussion} discusses what the evidence supports.",
  "HEADING: Data and methods",
  "HEADING: Algorithm",
  "HEADING: Universe and data",
  "HEADING: Costs and benchmarks",
  "HEADING: Statistics and procedure",
  "HEADING: Reproducing the original paper",
  "HEADING: CWMR on the ETFs, 1999--2024",
  "HEADING: Costs",
  "HEADING: The weekly variant",
  "HEADING: Robustness to the day the week ends",
  "HEADING: Trading one session late",
  "HEADING: The holdout",
  "HEADING: Pre-registered tests and deviations",
  "HEADING: Discussion",
  "HEADING: Conclusion",
  "HEADING: Data and code availability",
  "HEADING: Acknowledgments",
  "The author used Claude (Anthropic) to write analysis code and edit the manuscript.",
]

[conclusion]
says = "No significant lead over equal weight after correction, and no established tradable edge: the leads need costs at the open that were never measured, the daily lead comes from years when such costs were probably unavailable, the weekly variant was chosen on part of the window and its lead mostly vanishes a session later, and the variant chosen for the holdout failed it."
[conclusion.exempt]
C02 = "describes the original paper"
C41 = "where code lives, not a result"
C42 = "literature background"

