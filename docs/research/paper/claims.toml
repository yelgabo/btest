[[claim]]
id = "C08"
says = "The 1999-2024 results are in-sample for the weekly variant and assume unmeasured costs at the open, so they do not establish a tradable edge."
paper = [
  "These 1999--2024 results include the years the weekly variant was chosen on and assume costs at the open that were never measured, so they do not establish a tradable edge.",
  "Everything in Sections~\\ref{sec:results} to~\\ref{sec:weekly} came after and is exploratory, and 2016--2024 is not out of sample for any schedule.",
  "These strategies trade at the open, and over years in which we did not measure spreads at all.",
  "The reversal is between consecutive opens, so the cost of trading at the open, which we have not measured, decides whether the lead was real.",
  "These results are in-sample for the weekly variant and assume costs at the open that were never measured, so they do not establish a tradable edge for this CWMR variant over holding the same ETFs.",
]
evidence = [
  ["git", "btest", "2d74857", "weekly CWMR study"],
  ["output", "replication:expected/spreads.txt", "2016-2024 yearly estimates range from -34 to 74 bp; medians by ETF from -11 to 17 bp; measured half-spreads 0.17 to 1.68 bp, equal-weight average 0.70 bp"],
  ["git", "btest", "97b0d4a", "Pre-register CWMR on monthly and weekly bars"],
]

