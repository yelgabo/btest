  "Anticor \\citep{borodin2004}, passive aggressive mean reversion (PAMR; \\citealp{li2012pamr}), confidence weighted mean reversion (CWMR; \\citealp{li2011cwmr,li2013cwmr}), online moving average reversion (OLMAR; \\citealp{li2015olmar}) and robust median reversion (RMR; \\citealp{huang2013}) move weight from recent winners to recent losers.",
