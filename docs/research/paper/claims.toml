[[claim]]
id = "C10"
says = "The algorithm: the authors' CWMR, ported to within 7.1e-9, their parameters, the update rule, and how often it fires."
paper = [
  "All tests use the authors' CWMR as written in their public repository, ported to btest and checked against their function to within $7.1\\times10^{-9}$ per weight on their data.",
  "Their code describes it as a simplified version of the published algorithm \\citep{li2011cwmr,li2013cwmr}.",
  "Among other differences, its step size has no confidence term, a learning-rate factor $\\eta$ is added and the update is not mean-centred.",
  "We keep their parameters throughout ($\\epsilon = 0.89$, $\\theta = 0.92$, $\\eta = 0.93$) and never re-tune them.",
  "Each period the algorithm receives a vector $x$ of price ratios, one per asset ($x_i = 1.02$ means asset $i$ rose 2\\%).",
