# Claim ledger for cwmr-etf.tex: every claim the paper makes, where it says it, and the saved
# evidence it rests on. check_claims.py fails when a paper anchor or an evidence string is
# missing, and names the claims and the conclusion that must then be re-derived from the current
# evidence (not patched). Whitespace is collapsed before matching.
#
# Evidence paths start with "btest:" (this repository) or "replication:" (the
# cwmr-etf-replication repository, found at $CWMR_REPLICATION or ../cwmr-etf-replication).

[conclusion]
says = """No significant lead over equal weight after correction, and no evidence of a tradable
edge: the leads need costs at the open that were never measured, the daily lead comes from years
when such costs were unavailable, the weekly variant was chosen on part of the window and its
lead mostly vanishes a session later, and the variant chosen for the holdout failed it."""
paper = ["so we find no evidence of a tradable edge for this CWMR variant over holding the same ETFs"]
depends_on = ["C02", "C03", "C04", "C05", "C06", "C07", "C08", "C09", "C11", "C12", "C14"]

[[claim]]
id = "C01"
says = "The original paper's tables reproduce exactly from its code and data."
paper = ["reproduces their Tables~3 and~4 \\citep{lahanis2025} exactly: CWMR 1,590.38$\\times$"]
evidence = [["btest:docs/research/olps-replication/outputs/paper_data.out", "'CWMR': 1590.3818, 'PAMR': 788.2571, 'Anticor': 36.8868"]]

[[claim]]
id = "C02"
says = "At 0.7 bp, daily CWMR beats equal weight and SPY over 1999-2024."
paper = ["Daily & 12.13\\% & 0.56 & $-44.7$\\% & 170$\\times$", "Traded daily, CWMR returns 12.1\\% a year against 8.4\\%"]
evidence = [
  ["replication:expected/etf_tables.txt", "Daily 12.13% 0.56 -44.7% 170.4x"],
  ["replication:expected/etf_tables.txt", "Equal weight 8.37% 0.42 -54.4% 0.3x"],
  ["replication:expected/etf_tables.txt", "SPY 8.09% 0.40 -55.2% 0.0x"],
  ["btest:docs/research/olps-replication/outputs/paper_1999_2024.out", "Daily CAGR 12.13% Sharpe 0.56"],
]

[[claim]]
id = "C03"
says = "Daily CWMR's lead over equal weight is gone at about 2.2 bp per dollar traded."
paper = ["its lead over equal weight is gone at 2.2 basis points", "Daily & 12.13\\% & 1.56\\% & $-9.47$\\% & $-25.09$\\% & 2.2 & 2.3"]
evidence = [["replication:expected/etf_tables.txt", "Daily 12.13% 1.56% -9.47% -25.09% 2.18bp 2.29bp"]]

[[claim]]
id = "C04"
says = "Daily CWMR's lead over equal weight comes almost entirely from 1999-2008."
paper = ["the lead comes almost entirely from 1999--2008", "over 2009--2024 it returned 13.3\\% against equal weight's 12.8\\% and SPY's 14.5\\%"]
evidence = [
  ["replication:expected/robustness.txt", "Daily 1999-2008 10.33% 2009-2024 13.27%"],
  ["replication:expected/robustness.txt", "Equal weight 1999-2008 1.72% 2009-2024 12.75%"],
  ["replication:expected/robustness.txt", "SPY 1999-2008 -1.46% 2009-2024 14.52%"],
]

[[claim]]
id = "C05"
says = "Weekly bars matches daily's return with less trading; break-even about 5.2 bp against equal weight."
paper = ["Learning from weekly prices gives the same return with less trading (break-even 5.2 basis points)", "Weekly bars & 12.10\\% & 8.50\\% & 4.46\\% & $-3.17$\\% & 5.2 & 5.5"]
evidence = [
  ["replication:expected/etf_tables.txt", "Weekly bars 12.10% 0.55 -50.1% 76.1x"],
  ["replication:expected/etf_tables.txt", "Weekly bars 12.10% 8.50% 4.46% -3.17% 5.16bp 5.50bp"],
]

[[claim]]
id = "C06"
says = "Most of the weekly lead over equal weight disappears when each trade is made one session later."
paper = ["lowers weekly bars from 12.10\\% to 9.51\\% a year (Sharpe 0.44)"]
evidence = [["replication:expected/etf_tables.txt", "Signal at week end, trade a session later 9.51% 0.44 bootstrap p vs EW 0.843"]]

[[claim]]
id = "C07"
says = "No Sharpe difference against equal weight is significant after Holm, at any block length."
paper = ["the smallest $p$ at any block length is 0.11 (weekly bars against SPY, 126-day blocks), and against equal weight it is 0.35"]
evidence = [
  ["replication:expected/robustness.txt", "Daily vs Equal weight 0.091, 0.071, 0.066, 0.054, 0.061 | Holm 0.726, 0.509, 0.459, 0.352, 0.430"],
  ["replication:expected/robustness.txt", "Weekly bars vs Equal weight 0.139, 0.111, 0.083, 0.048, 0.048 | Holm 0.834, 0.665, 0.500, 0.352, 0.384"],
  ["replication:expected/robustness.txt", "Weekly bars vs SPY 0.098, 0.064, 0.031, 0.017, 0.012 | Holm 0.726, 0.509, 0.278, 0.157, 0.107"],
]

[[claim]]
id = "C08"
says = "No return lead over equal weight is significant after Holm at any block length; weekly bars comes closest (0.052 at 126 days)."
paper = ["though weekly bars' return lead comes close (Holm-adjusted $p = 0.052$ with 126-day blocks)", "the leads over equal weight stay above 0.05 at every block length"]
evidence = [
  ["replication:expected/robustness.txt", "Weekly bars vs Equal weight 0.051, 0.036, 0.021, 0.009, 0.006 | Holm 0.308, 0.219, 0.148, 0.072, 0.052"],
  ["replication:expected/robustness.txt", "Daily vs Equal weight 0.031, 0.020, 0.021, 0.013, 0.020 | Holm 0.246, 0.162, 0.148, 0.088, 0.141"],
  ["replication:expected/robustness.txt", "Daily vs Equal weight +3.41% [+0.62%, +6.32%] p 0.021 Holm 0.148"],
  ["replication:expected/robustness.txt", "Weekly bars vs Equal weight +3.39% [+0.58%, +6.32%] p 0.021 Holm 0.148"],
]

[[claim]]
id = "C09"
says = "Weekly bars' return lead over SPY is significant after Holm with 63- and 126-day blocks, not with the main 21-day blocks."
paper = ["Weekly bars' lead over SPY is significant after correction with 63- and 126-day blocks (0.043 and 0.024; unadjusted 0.005 and 0.003), but not with the 21-day blocks of our main specification (0.085)"]
evidence = [["replication:expected/robustness.txt", "Weekly bars vs SPY 0.044, 0.027, 0.009, 0.005, 0.003 | Holm 0.306, 0.186, 0.085, 0.043, 0.024"]]

[[claim]]
