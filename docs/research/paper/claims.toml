  "Closest to this paper, \\citet{moon2019} test PAMR, OLMAR and cost-optimised variants on S\\&P~500 stocks over 2000--2017; they find that the standard benchmark datasets favour mean reversion and that the strategies may fail when explicit or implicit costs exist.",
