[project]
name = "btest"
version = "0.1.0"
description = "Minute-bar backtesting for Python trading strategies"
authors = [
    { name = "yelgabo", email = "yelnilgabo@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "httpx>=0.28.1",
    "numba>=0.68.0",
    "pandas-market-calendars>=5.4.0",
    "polars>=1.44.2",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "scipy>=1.18.1",
    "starlette>=1.7.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
btest = "btest.cli:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# docs/research holds replication scripts (e.g. ndx_test.py) that are not tests.
testpaths = ["tests"]
